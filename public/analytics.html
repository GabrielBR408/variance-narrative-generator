<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChiefEO Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2a3a;--muted:#64748b;--accent:#2e7da6;--line:#e5e9ee;--err:#c0392b;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:960px;margin:0 auto;padding:20px}
h1{font-size:1.4rem;margin:0 0 2px}.sub{color:var(--muted);margin:0 0 14px;font-size:.9rem}
.toolbar{display:flex;gap:10px;margin:0 0 16px;flex-wrap:wrap;align-items:center}
.toolbar select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:.9rem;color:var(--ink);max-width:230px}
.ranges{display:flex;gap:8px;flex-wrap:wrap}
.ranges button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.ranges button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chk{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);cursor:pointer;user-select:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-size:1.7rem;font-weight:700;line-height:1.1}
.stat .l{color:var(--muted);font-size:.78rem;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
.card h2{margin:0 0 2px;font-size:1.05rem}.card h3{margin:0 0 8px;font-size:.95rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.grid2{grid-template-columns:1fr}}
.chartbox{position:relative;height:280px}
.chartbox.sm{height:240px}
.note{color:var(--muted);font-size:.8rem;margin:6px 0 0}
.row{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:.86rem}
.row .lbl{width:150px;color:var(--muted);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .track{flex:1;background:#eef2f6;border-radius:5px;height:14px;overflow:hidden}
.row .fill{background:var(--accent);height:100%}
.row .n{width:44px;text-align:right;flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:.8rem}
.tbl th,.tbl td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
.tbl td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.feedbox{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.errs{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.errtbl{width:100%;border-collapse:collapse;margin-top:6px;font-size:.78rem}
.errtbl th,.errtbl td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.errtbl th{color:var(--muted);font-weight:600}
.errtbl td.reason{color:var(--err)}
.errtbl td.det{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-word}
.errtbl td.t{color:var(--muted);white-space:nowrap}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:.72rem;color:#fff}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:.7rem;background:#fdf1e3;color:var(--warn);border:1px solid #f3ddc0}
tr.int td{opacity:.55}
.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 10px;font-size:.75rem;cursor:pointer;color:var(--ink)}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.tokbox{max-width:420px;margin:60px auto;text-align:center}
.tokbox input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:10px 0;font-size:1rem}
.tokbox button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font-size:1rem}
.muted{color:var(--muted);font-size:.85rem}.err{color:var(--err)}
</style></head>
<body><div class="wrap" id="app"></div>
<script>
var API="https://dsmbppzvembacitwdrsj.supabase.co/functions/v1/app-analytics";
var app=document.getElementById('app');
var range=localStorage.getItem('chiefeo_dash_range')||'30d';
var appFilter=localStorage.getItem('chiefeo_dash_app')||'';         // '' = all apps
var showInternal=localStorage.getItem('chiefeo_dash_internal')==='1'; // default: my/internal traffic hidden
var DEVICES=[];  // last-loaded device list, referenced by index from buttons
var CHARTS=[];
var PALETTE=['#2e7da6','#5bc0be','#e08a3c','#9b5de5','#c0392b','#3fa34d','#e6b800','#6c757d','#ff6392','#00a6a6'];
function colorFor(i){return PALETTE[i%PALETTE.length];}
function tok(){return localStorage.getItem('chiefeo_dash_token')||'';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;';});}
function fmtTime(t){if(!t)return '—';var d=new Date(t);return isNaN(d)?'—':d.toLocaleString();}
function detailText(d){if(!d)return '—';var b=[];if(d.code)b.push(d.code);if(d.source&&d.source!=='unknown')b.push('from:'+d.source);if(d.online==='false'||d.online===false)b.push('offline');if(d.mic&&d.mic!=='unknown')b.push('mic:'+d.mic);if(d.ua)b.push(d.ua);return b.length?b.join(' · '):'—';}

/* ---- token gate: preserved auth flow (chiefeo_dash_token + Bearer header) ---- */
function askToken(msg){app.innerHTML="<div class='tokbox'><h1>ChiefEO Analytics</h1><p class='muted'>Enter your access token.</p>"+(msg?"<p class='err'>"+esc(msg)+"</p>":"")+"<input id='t' type='password' placeholder='access token' onkeydown=\"if(event.key==='Enter')saveTok()\"><br><button onclick='saveTok()'>Unlock</button></div>";}
function saveTok(){var v=document.getElementById('t').value.trim();if(v){localStorage.setItem('chiefeo_dash_token',v);load();}}

function bar(lbl,n,max){var w=max>0?Math.round(n/max*100):0;return "<div class='row'><div class='lbl'>"+esc(lbl)+"</div><div class='track'><div class='fill' style='width:"+w+"%'></div></div><div class='n'>"+n+"</div></div>";}

/* ---- toolbar: app dropdown + range buttons + internal-traffic toggle ---- */
function toolbar(d){
  var apps=d.allApps||[];
  // Keep a stale selection visible even if it has no data in this range.
  if(appFilter&&apps.indexOf(appFilter)<0)apps=apps.concat([appFilter]);
  var opts="<option value=''>All apps</option>"+apps.map(function(a){return "<option value='"+esc(a)+"'"+(a===appFilter?" selected":"")+">"+esc(a)+"</option>";}).join('');
  var h="<div class='toolbar'>";
  h+="<select id='appSel' onchange='setApp(this.value)'>"+opts+"</select>";
  h+="<div class='ranges'>"+[['7d','7 days'],['30d','30 days'],['90d','90 days'],['all','All']].map(function(r){return "<button class='"+(range===r[0]?'on':'')+"' onclick=\"setRange('"+r[0]+"')\">"+r[1]+"</button>";}).join('')+"</div>";
  h+="<label class='chk'><input type='checkbox' "+(showInternal?"checked":"")+" onchange='setInternal(this.checked)'> Show my/internal traffic</label>";
  h+="</div>";
  return h;
}
function setRange(x){range=x;localStorage.setItem('chiefeo_dash_range',x);load();}
function setApp(x){appFilter=x;localStorage.setItem('chiefeo_dash_app',x);load();}
function setInternal(x){showInternal=!!x;localStorage.setItem('chiefeo_dash_internal',x?'1':'0');load();}

function statCards(d){
  var cards=[
    ['Total events',(d.rowCount||0).toLocaleString()],
    ['Events today',(d.eventsToday||0).toLocaleString()],
    ['Events this week',(d.eventsThisWeek||0).toLocaleString()],
    ['Unique devices',((d.uniqueDevices!=null?d.uniqueDevices:d.uniqueSessions)||0).toLocaleString()],
    ['Visits',(d.visits!=null?d.visits:d.activeDays||0).toLocaleString()]
  ];
  return "<div class='cards'>"+cards.map(function(c){return "<div class='stat'><div class='v'>"+c[1]+"</div><div class='l'>"+c[0]+"</div></div>";}).join('')+"</div>";
}

function appPill(name,i){return "<span class='pill' style='background:"+colorFor(i)+"'>"+esc(name)+"</span>";}

/* ---- device list with exclude/include buttons ---- */
function devicesCard(d){
  DEVICES=d.devices||[];
  if(!DEVICES.length)return "";
  var plats=Object.entries(d.devicesByPlatform||{}).sort(function(a,b){return b[1]-a[1];});
  var pmax=plats.reduce(function(m,p){return Math.max(m,p[1]);},0);
  var h="<div class='card'><h3>Devices <span class='muted'>(persistent per-device IDs · excluded ones are dimmed)</span></h3>";
  if(plats.length)h+=plats.map(function(p){return bar(p[0],p[1],pmax);}).join('')+"<div style='height:10px'></div>";
  h+="<div class='feedbox'><table class='tbl'><thead><tr><th>Device</th><th>Platform</th><th>Apps</th><th>Events</th><th>Last seen</th><th></th></tr></thead><tbody>";
  DEVICES.forEach(function(v,i){
    var id=String(v.device_id||'');
    h+="<tr class='"+(v.internal?"int":"")+"'>";
    h+="<td class='mono' title='"+esc(id)+"'>"+esc(id.slice(0,8))+(v.flagged?" <span class='tag'>flagged</span>":"")+(v.internal?" <span class='tag'>excluded</span>":"")+"</td>";
    h+="<td>"+esc(v.platform||'')+(v.browser?" · "+esc(v.browser):"")+"</td>";
    h+="<td>"+esc((v.apps||[]).join(', '))+"</td>";
    h+="<td>"+(v.events||0)+"</td>";
    h+="<td>"+fmtTime(v.lastSeen)+"</td>";
    h+="<td><button class='mini' onclick='markDevice("+i+","+(v.internal?"false":"true")+")'>"+(v.internal?"Include":"Exclude")+"</button></td>";
    h+="</tr>";
  });
  h+="</tbody></table></div>";
  h+="<p class='note'>Exclude a device to hide its traffic from all charts (past and future). Spot yours by platform + last-seen time — or open an app right before refreshing and yours will be at the top.</p></div>";
  return h;
}
function markDevice(i,exclude){
  var v=DEVICES[i];if(!v)return;
  fetch(API,{method:'POST',headers:{Authorization:'Bearer '+tok(),'Content-Type':'application/json'},
    body:JSON.stringify({action:exclude?'exclude':'include',device_id:v.device_id,note:exclude?('excluded from dashboard '+new Date().toISOString().slice(0,10)):undefined})})
    .then(function(r){return r.json();})
    .then(function(res){if(res&&res.ok)load();else alert('Failed: '+((res&&res.error)||'unknown'));})
    .catch(function(e){alert('Failed: '+e.message);});
}

function render(d){
  CHARTS.forEach(function(c){try{c.destroy();}catch(e){}});CHARTS=[];
  var noChart=(typeof Chart==='undefined');
  var sub=(d.rowCount||0)+" events in range";
  if(appFilter)sub+=" · app: "+esc(appFilter);
  if(!d.internalIncluded&&d.hiddenInternalEvents)sub+=" · "+d.hiddenInternalEvents+" internal hidden";
  sub+=" · updated "+fmtTime(d.generatedAt);
  var h="<h1>ChiefEO Analytics</h1><p class='sub'>"+sub+"</p>";
  h+=toolbar(d);
  if(!d.rowCount){app.innerHTML=h+"<p class='muted'>No events in this range"+(appFilter?" for "+esc(appFilter):"")+(!d.internalIncluded&&d.hiddenInternalEvents?" (internal traffic is hidden — tick the checkbox to see it)":"")+".</p>"+devicesCard(d);return;}
  h+=statCards(d);
  if(noChart){h+="<div class='card'><p class='note'>Charts unavailable (chart library didn't load). Tables below still work.</p></div>";}

  // 1. Events by day (stacked by app)
  h+="<div class='card'><h3>Events by day"+(noChart?"":" (stacked by app)")+"</h3><div class='chartbox'><canvas id='cByDay'></canvas></div></div>";
  // 2 & 3. Events by app | Events by type
  h+="<div class='grid2'>";
  h+="<div class='card'><h3>Events by app</h3><div class='chartbox sm'><canvas id='cByApp'></canvas></div></div>";
  h+="<div class='card'><h3>Top event types</h3><div class='chartbox sm'><canvas id='cByName'></canvas></div></div>";
  h+="</div>";
  // 4. Hour-of-day
  h+="<div class='card'><h3>Events by hour of day <span class='muted'>(UTC)</span></h3><div class='chartbox sm'><canvas id='cByHour'></canvas></div></div>";

  // 5. Devices (with exclude/include controls)
  h+=devicesCard(d);

  // 6. Recent events feed
  h+="<div class='card'><h3>Recent events <span class='muted'>(latest "+((d.recentEvents||[]).length)+")</span></h3><div class='feedbox'><table class='tbl'><thead><tr><th>Time</th><th>App</th><th>Event</th><th>Device</th></tr></thead><tbody>"+
    (d.recentEvents||[]).map(function(e){return "<tr><td>"+fmtTime(e.time)+"</td><td>"+esc(e.app)+"</td><td class='mono'>"+esc(e.event)+"</td><td class='mono'>"+esc(e.device||'')+"</td></tr>";}).join('')+
    "</tbody></table></div></div>";

  // Per-app detail
  h+="<div class='card'><h2>Per-app detail</h2>";
  (d.apps||[]).forEach(function(a,i){
    var evs=Object.keys(a.eventCounts||{}).map(function(k){return [k,a.eventCounts[k]];}).sort(function(x,y){return y[1]-x[1];}).slice(0,10);
    var max=evs.reduce(function(m,e){return Math.max(m,e[1]);},0);
    h+="<div style='margin-top:14px;padding-top:12px;border-top:1px solid var(--line)'>";
    h+="<div>"+appPill(a.app,i)+" <b>"+a.totalSessions+"</b> <span class='muted'>devices · "+a.totalEvents+" events · "+(a.successRate==null?'—':a.successRate+'% success')+"</span></div>";
    h+=evs.map(function(e){return bar(e[0],e[1],max);}).join('');
    if(a.recentErrors&&a.recentErrors.length){
      h+="<div class='errs'><div class='muted'>recent errors/failures</div><table class='errtbl'><thead><tr><th>Reason</th><th>Detail</th><th>Time</th></tr></thead><tbody>"+
        a.recentErrors.map(function(e){return "<tr><td class='reason'>"+esc(e.reason)+"</td><td class='det'>"+esc(detailText(e.detail))+"</td><td class='t'>"+fmtTime(e.time)+"</td></tr>";}).join('')+
        "</tbody></table></div>";
    }
    h+="</div>";
  });
  h+="</div>";

  app.innerHTML=h;
  if(!noChart)buildCharts(d);
}

function buildCharts(d){
  var noGrid={grid:{display:false}};
  var intY={beginAtZero:true,ticks:{precision:0}};
  try{
    var apps=Object.keys((d.timeseries&&d.timeseries.apps)||{});
    var ds=apps.map(function(a,i){return {label:a,data:d.timeseries.apps[a],backgroundColor:colorFor(i),borderWidth:0};});
    CHARTS.push(new Chart(document.getElementById('cByDay'),{type:'bar',
      data:{labels:(d.timeseries&&d.timeseries.dates)||[],datasets:ds},
      options:{responsive:true,maintainAspectRatio:false,
        scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,ticks:{precision:0}}},
        plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}}}}));
  }catch(e){}
  try{
    var ea=Object.entries(d.eventsByApp||{}).sort(function(a,b){return b[1]-a[1];});
    CHARTS.push(new Chart(document.getElementById('cByApp'),{type:'bar',
      data:{labels:ea.map(function(e){return e[0];}),datasets:[{data:ea.map(function(e){return e[1];}),backgroundColor:ea.map(function(e,i){return colorFor(i);}),borderWidth:0}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:intY,y:noGrid}}}));
  }catch(e){}
  try{
    var en=Object.entries(d.eventsByName||{}).sort(function(a,b){return b[1]-a[1];}).slice(0,12);
    CHARTS.push(new Chart(document.getElementById('cByName'),{type:'bar',
      data:{labels:en.map(function(e){return e[0];}),datasets:[{data:en.map(function(e){return e[1];}),backgroundColor:'#2e7da6',borderWidth:0}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:intY,y:noGrid}}}));
  }catch(e){}
  try{
    var hrs=[];for(var i=0;i<24;i++)hrs.push(i+'h');
    CHARTS.push(new Chart(document.getElementById('cByHour'),{type:'bar',
      data:{labels:hrs,datasets:[{data:d.hourOfDay||[],backgroundColor:'#5bc0be',borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:noGrid,y:intY}}}));
  }catch(e){}
}

function load(){
  var t=tok();if(!t){askToken('');return;}
  app.innerHTML="<p class='muted'>Loading…</p>";
  var qs='?range='+encodeURIComponent(range);
  if(appFilter)qs+='&app='+encodeURIComponent(appFilter);
  if(showInternal)qs+='&internal=1';
  fetch(API+qs,{headers:{Authorization:'Bearer '+t}})
    .then(function(r){
      if(r.status===401){localStorage.removeItem('chiefeo_dash_token');askToken('Invalid token.');return null;}
      if(!r.ok){app.innerHTML="<p class='err'>Error: server returned "+r.status+"</p>";return null;}
      return r.json();
    })
    .then(function(d){if(d)render(d);})
    .catch(function(e){app.innerHTML="<p class='err'>Error: "+esc(e.message)+"</p>";});
}
load();
</script></body></html>
