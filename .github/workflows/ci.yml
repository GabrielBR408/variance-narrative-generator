name: CI

# push is limited to main so PR commits run once (via pull_request), not twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # npm ci installs the exact lockfile tree, so CI can't green-light a
      # dependency set that drifts from package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test

      - name: Build
        run: npm run build
