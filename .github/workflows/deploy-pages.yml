name: Deploy to GitHub Pages

# Publishes a static, fully client-side build for UI testing. The app's
# /generate round-trip falls back to an in-browser pipeline on a static host
# (see src/lib/clientGenerate.js), so Generate + exports work without a server.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-progress deploy at a time; let a newer push supersede an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build (with Pages base path)
        run: npm run build
        env:
          # actions/configure-pages exposes the correct base_path for the repo's
          # Pages URL (e.g., /variance-narrative-generator/).
          VITE_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Replace Pages build with Vercel redirect
        run: |
          cat > dist/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta http-equiv="refresh" content="0; url=https://chiefeotool.com/vng" />
            <link rel="canonical" href="https://chiefeotool.com/vng" />
            <title>Variance Narrative Generator</title>
          </head>
          <body>
            <p>This app has moved to
              <a href="https://chiefeotool.com/vng">variance-narrative-generator.vercel.app</a>.
              Redirecting&hellip;
            </p>
            <script>window.location.replace("https://chiefeotool.com/vng")</script>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
