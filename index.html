<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c2a3a" />
    <title>ChiefEO Tool</title>
    <meta name="description" content="Practical tools for commercial property management" />

    <!-- Open Graph / link previews (iMessage, social, etc.). This one index.html
         is shared by the hub (/) and the /vng app, so the canonical identity is
         the hub — ChiefEO Tool — not any single tool. -->
    <meta property="og:title" content="ChiefEO Tool" />
    <meta property="og:description" content="Practical tools for commercial property management" />
    <meta property="og:url" content="https://chiefeotool.com/" />
    <meta property="og:site_name" content="ChiefEO Tool" />
    <!-- Absolute URL: relative og:image paths don't resolve in link previews.
         The 512 app icon is a neutral ChiefEO mark (not a VNG graphic). -->
    <meta property="og:image" content="https://chiefeotool.com/icons/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ChiefEO Tool" />
    <meta name="twitter:description" content="Practical tools for commercial property management" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
