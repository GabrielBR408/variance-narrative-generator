<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c2a3a" />
    <!-- Hub <head>. This index.html is the SPA shell for /, /skills, /tos and
         /privacy — main.jsx overrides document.title per route at runtime, so
         what is written here is what crawlers and link previews see for the site
         as a whole. It therefore describes the ChiefEO hub (all tools), not any
         single tool. VNG's own title/description/OG/SoftwareApplication block
         moved with the app to the chiefeo-vng repo when /vng became a proxied
         path; do not reintroduce per-tool copy here. -->
    <title>ChiefEO — Commercial Property Management Tools</title>
    <meta name="description" content="Practical tools for commercial property teams — variance narratives, GL drill-downs, owner reports, stacking plans, inspection reports and utility forecasts. Built for the work, not the demo." />
    <link rel="canonical" href="https://chiefeotool.com/" />

    <!-- Open Graph / link previews (iMessage, social, etc.). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ChiefEO — Commercial Property Management Tools" />
    <meta property="og:description" content="One place for the recurring property-management busywork: variance narratives, GL drill-downs, owner reports, stacking plans, inspections and utility forecasts." />
    <meta property="og:url" content="https://chiefeotool.com/" />
    <meta property="og:site_name" content="ChiefEO" />
    <!-- Absolute URL: relative og:image paths don't resolve in link previews.
         1200x630 hub card, styled to match the per-tool cards under /images/. -->
    <meta property="og:image" content="https://chiefeotool.com/images/og-hub.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ChiefEO — six commercial property management tools" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ChiefEO — Commercial Property Management Tools" />
    <meta name="twitter:description" content="One place for the recurring property-management busywork: variance narratives, GL drill-downs, owner reports, stacking plans, inspections and utility forecasts." />

    <!-- Site-level JSON-LD for the hub: WebSite + the publishing Organization.
         Per-tool SoftwareApplication markup belongs on each tool's own surface
         (VNG's now ships from chiefeo-vng). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://chiefeotool.com/#website",
            "url": "https://chiefeotool.com/",
            "name": "ChiefEO",
            "description": "A suite of practical tools for commercial property management and property accounting.",
            "inLanguage": "en-US",
            "publisher": { "@id": "https://chiefeotool.com/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://chiefeotool.com/#organization",
            "name": "Golden Real Estate Ventures and Exchanges LLC",
            "alternateName": "ChiefEO",
            "url": "https://chiefeotool.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://chiefeotool.com/icons/icon-512.png",
              "width": 512,
              "height": 512
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
