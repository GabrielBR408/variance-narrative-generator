<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c2a3a" />
    <!-- SEO package mapping (DEPLOYMENT_CHECKLIST.md rows 1–3): the homepage is
         VNG's landing surface, so the title/description/OG copy below is the
         package's VNG block verbatim. Note this index.html is still shared by
         the hub (/), /vng and /skills — main.jsx overrides document.title per
         route at runtime, so this static title is what crawlers and link
         previews see for the site as a whole. -->
    <title>VNG — Variance Narrative Generator | ChiefEO</title>
    <meta name="description" content="Turn GL variance data into owner-ready narratives, grounded in the actual transactions. Every line traces back to the GL. Auditable, not a black box." />

    <!-- Open Graph / link previews (iMessage, social, etc.). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VNG: Variance Narratives Grounded in Your GL — ChiefEO" />
    <meta property="og:description" content="Every variance narrative traces back to real GL transactions. No black-box AI guessing — just faster write-ups." />
    <meta property="og:url" content="https://chiefeotool.com/" />
    <meta property="og:site_name" content="ChiefEO" />
    <!-- The package specifies /images/vng-screenshot.png here; that file does not
         exist in this repo, so the existing 512 app icon (a neutral ChiefEO mark)
         is kept instead. Absolute URL: relative og:image paths don't resolve in
         link previews. Swap to the screenshot — and to twitter:card
         summary_large_image — once a real screenshot is committed. -->
    <meta property="og:image" content="https://chiefeotool.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VNG: Variance Narratives Grounded in Your GL — ChiefEO" />
    <meta name="twitter:description" content="Every variance narrative traces back to real GL transactions. No black-box AI guessing — just faster write-ups." />

    <!-- SoftwareApplication JSON-LD for VNG (schema_markup.md block 1). The
         package's "image" field points at /images/vng-screenshot.png, which
         doesn't exist — omitted rather than pointed at a 404. "price": "0" is
         the package's assumption; confirm before this goes live. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "VNG — Variance Narrative Generator",
        "description": "Converts general ledger variance data into owner-ready narrative commentary, grounded directly in GL transactions. Built for property accountants and PMs who need auditable, defensible variance explanations without manual write-ups.",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Commercial Real Estate Accounting Tool",
        "operatingSystem": "Web",
        "browserRequirements": "Requires a modern browser with JavaScript enabled (Chrome, Edge, Firefox, Safari — current versions)",
        "url": "https://chiefeotool.com",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Golden Real Estate Ventures and Exchanges LLC",
          "url": "https://chiefeotool.com"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
